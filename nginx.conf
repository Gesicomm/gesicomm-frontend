server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html NUNCA se cachea.
    #
    # Sin cabeceras de cache, el navegador aplica su heurística: como la
    # respuesta trae Last-Modified, se guarda "fresca" durante ~10% del tiempo
    # transcurrido desde esa fecha (horas, después de unos días sin deploy).
    # Resultado: después de publicar, la gente seguía viendo el index.html
    # viejo — apuntando a bundles /assets/ que ya no existen — y la pantalla
    # se quedaba cargando sin ningún error visible.
    #
    # El HTML se revalida siempre y los bundles (con hash en el nombre) se
    # cachean para siempre.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
