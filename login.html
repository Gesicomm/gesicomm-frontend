<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesicomm - Autenticación</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            box-shadow: 0 0 50px rgba(255, 0, 128, 0.2);
            border-radius: 12px;
            text-align: center;
        }

        .auth-logo {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            display: inline-block;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 1.2rem;
        }

        .auth-form.active {
            display: flex;
        }

        .auth-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #ff007f;
        }

        .input-group {
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: #aaa;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff007f;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .auth-btn {
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            color: #fff;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            margin-top: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
        }

        .auth-links {
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .auth-links a {
            color: #ff007f;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .auth-links a:hover {
            color: #ff4da6;
            text-decoration: underline;
        }
        
        .back-home {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s;
        }
        
        .back-home:hover {
            color: #ff007f;
        }

    </style>
</head>
<body>
    <a href="index.html" class="back-home">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Volver
    </a>

    <div class="auth-container">
        <a href="index.html" class="auth-logo glitch" data-text="GESICOMM" style="font-size: 2rem; text-shadow: 0.025em 0 0 rgba(255,0,0,0.75), -0.0125em -0.025em 0 rgba(0,255,0,0.75), 0.0125em 0.025em 0 rgba(0,0,255,0.75);">GESICOMM</a>

        <!-- Formulario de Login -->
        <form id="login-form" class="auth-form active">
            <h2 class="auth-title">Iniciar Sesión</h2>
            <div class="input-group">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" required placeholder="correo@ejemplo.com">
            </div>
            <div class="input-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="auth-btn">Ingresar</button>
            <div class="auth-links">
                <p><a onclick="switchForm('forgot-form')">¿Olvidaste tu contraseña?</a></p>
                <p>¿No tienes cuenta? <a onclick="switchForm('register-form')">Regístrate aquí</a></p>
            </div>
        </form>

        <!-- Formulario de Registro -->
        <form id="register-form" class="auth-form">
            <h2 class="auth-title">Crear Cuenta</h2>
            <div class="input-group">
                <label for="reg-name">Nombre Completo</label>
                <input type="text" id="reg-name" required placeholder="Tu nombre">
            </div>
            <div class="input-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" required placeholder="correo@ejemplo.com">
            </div>
            <div class="input-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="auth-btn">Registrarse</button>
            <div class="auth-links">
                <p>¿Ya tienes cuenta? <a onclick="switchForm('login-form')">Inicia sesión</a></p>
            </div>
        </form>

        <!-- Formulario de Recuperación -->
        <form id="forgot-form" class="auth-form">
            <h2 class="auth-title">Recuperar Contraseña</h2>
            <p style="color: #ccc; font-size: 0.9rem; margin-bottom: 1rem; text-align: left;">Ingresa tu correo y te enviaremos las instrucciones para restablecer tu contraseña.</p>
            <div class="input-group">
                <label for="forgot-email">Correo Electrónico</label>
                <input type="email" id="forgot-email" required placeholder="correo@ejemplo.com">
            </div>
            <button type="submit" class="auth-btn">Enviar Instrucciones</button>
            <div class="auth-links">
                <p>Volver a <a onclick="switchForm('login-form')">Iniciar Sesión</a></p>
            </div>
        </form>
    </div>

    <script>
        function switchForm(formId) {
            document.querySelectorAll('.auth-form').forEach(form => {
                form.classList.remove('active');
            });
            document.getElementById(formId).classList.add('active');
        }
        
        // Evitar submit por defecto para la demo
        document.querySelectorAll('form').forEach(f => {
            f.addEventListener('submit', e => e.preventDefault());
        });
    </script>
</body>
</html>
