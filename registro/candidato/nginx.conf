server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # El proxy exterior transmite los assets de este contenedor. Comprimir
    # acá evita descargar el JS/CSS completo en la primera visita.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    # The provider files are a read-only private mount, outside this build.
    location ^~ /director-recursos/ {
        if ($host !~ ^(www\.)?gesicomm\.com$) { return 404; }
        auth_request /__gesicom_director_acceso;
        alias /opt/gesicom-director/;
        autoindex off;
        add_header X-Gesicom-Director 1;
        add_header Cache-Control "private, no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self' blob: data:; worker-src 'self' blob:; form-action 'none'; base-uri 'none'; frame-ancestors 'self'; sandbox allow-scripts allow-same-origin" always;
    }

    location = /__gesicom_director_acceso {
        internal;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $director_backend http://gesicomm-back:3000;
        proxy_pass $director_backend/api/mi-tienda;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host api.gesicomm.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    location = / {
        if ($host ~* ^(www\.)?gesicomm\.com$) { rewrite ^ /__gesicom_preview/inicio.html last; }
        try_files $uri $uri/ /index.html;
    }

    location = /solicitar-prueba {
        if ($host ~* ^(www\.)?gesicomm\.com$) { rewrite ^ /__gesicom_preview/solicitar-prueba.html last; }
        try_files $uri $uri/ /index.html;
    }

    location = /crear-cuenta {
        if ($host ~* ^(www\.)?gesicomm\.com$) { rewrite ^ /__gesicom_preview/crear-cuenta.html last; }
        try_files $uri $uri/ /index.html;
    }

    location = /inicio {
        if ($host ~* ^(www\.)?gesicomm\.com$) { return 302 https://gesicomm.com/; }
        try_files $uri $uri/ /index.html;
    }

    location = /__gesicom_preview/inicio.html {
        internal;
        alias /opt/gesicom-prueba/inicio.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://cdn.shopify.com; connect-src https://api.gesicomm.com; frame-src https://pay.hotmart.com; form-action 'none'; base-uri 'none'; frame-ancestors 'none' " always;
    }

    location = /registro/oferta {
        client_max_body_size 1k;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $registro_backend http://gesicom-registro:8080;
        proxy_pass $registro_backend/oferta;
        proxy_read_timeout 25s;
    }

    location = /__gesicom_preview/crear-cuenta.html {
        internal;
        alias /opt/gesicom-prueba/crear-cuenta.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://cdn.shopify.com; connect-src 'self' https://api.gesicomm.com; frame-src https://pay.hotmart.com; form-action 'none'; base-uri 'none'; frame-ancestors 'none' " always;
    }

    location ^~ /__gesicom_preview/ {
        internal;
        alias /opt/gesicom-prueba/;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://cdn.shopify.com; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none' " always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html NUNCA se cachea.
    #
    # Sin cabeceras de cache, el navegador aplica su heurística: como la
    # respuesta trae Last-Modified, se guarda "fresca" durante ~10% del tiempo
    # transcurrido desde esa fecha (horas, después de unos días sin deploy).
    # Resultado: después de publicar, la gente seguía viendo el index.html
    # viejo — apuntando a bundles /assets/ que ya no existen — y la pantalla
    # se quedaba cargando sin ningún error visible.
    #
    # El HTML se revalida siempre y los bundles (con hash en el nombre) se
    # cachean para siempre.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location /assets/ {
        try_files $uri =404;
        error_page 404 = @asset_not_found;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Un chunk viejo no debe dejar un 404 cacheado por el navegador/CDN.
    location @asset_not_found {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
