<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Gesicomm">
  <title>Gesicomm</title>
  <defs>
    <linearGradient id="gsc-ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#4F3FD6"/>
    </linearGradient>
  </defs>
  <!-- Anillo abierto: el ciclo de operación (sincronizar, vender, despachar). -->
  <path d="M43.47 15.62 A20 20 0 1 0 50.13 40.45"
        fill="none" stroke="url(#gsc-ring)" stroke-width="9" stroke-linecap="round"/>
  <!-- Nodo en la apertura: la integración externa que se conecta al ciclo. -->
  <circle cx="51.32" cy="26.82" r="6.5" fill="#22D3EE"/>
</svg>
