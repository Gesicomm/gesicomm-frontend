<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Gesicom">
  <title>Gesicom</title>
  <!--
    Versión para app icon: Meta App Icon, Apple Touch Icon, Android e
    instalación PWA. Sin texto y a sangre completa, porque cada plataforma
    aplica su propia máscara de esquinas. El glifo ocupa el 58% del lienzo,
    dentro de la zona segura del 80% que exigen los iconos maskable.

    Es la variante "negativo" del manual: fondo Azul Profundo, G en blanco,
    punto en Oro Digital.
  -->
  <rect width="512" height="512" fill="#0B1D3D"/>
  <g transform="translate(63.3 67.2) scale(5.9)">
    <path d="M48.27 24.31 A18.9 18.9 0 1 0 49.49 35.93 L37 35.93"
          fill="none" stroke="#FFFFFF" stroke-width="8.3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="49" cy="48.5" r="6.5" fill="#FFC107"/>
  </g>
</svg>
