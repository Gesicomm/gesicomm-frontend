<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="Gesicomm">
  <title>Gesicomm</title>
  <!-- Igual que gesicomm-horizontal.svg pero con el wordmark en blanco hueso,
       para usar sobre fondos oscuros. -->
  <defs>
    <linearGradient id="ho-ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9E92FF"/>
      <stop offset="1" stop-color="#6D5EF8"/>
    </linearGradient>
  </defs>
  <path d="M43.47 15.62 A20 20 0 1 0 50.13 40.45"
        fill="none" stroke="url(#ho-ring)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="51.32" cy="26.82" r="6.5" fill="#22D3EE"/>
  <text x="76" y="42"
        font-family="Inter Variable, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-1.1" fill="#F4F4F6">Gesicomm</text>
</svg>
