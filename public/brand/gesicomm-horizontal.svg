<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="Gesicomm">
  <title>Gesicomm</title>
  <!--
    Lockup horizontal para cabeceras, firmas de correo y documentos.
    El isotipo mantiene su caja de 64x64 y el texto arranca a 76 px, dejando
    un aire igual a la mitad del alto del símbolo.

    El wordmark va como <text>: en un SVG suelto se resuelve con la pila de
    fuentes del sistema. Dentro de la app se usa el componente <Logo>, que
    dibuja el símbolo en SVG y el texto en HTML, para que tome la misma
    tipografía que ya carga la aplicación.
  -->
  <path d="M48.27 24.31 A18.9 18.9 0 1 0 49.49 35.93 L37 35.93"
        fill="none" stroke="#0B1D3D" stroke-width="8.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="49" cy="48.5" r="6.5" fill="#FFC107"/>
  <text x="76" y="42"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-1.1" fill="#0B1D3D">Gesicomm</text>
</svg>
