<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="Gesicomm">
  <title>Gesicomm</title>
  <!--
    Lockup horizontal para cabeceras, firmas de correo y documentos.
    El isotipo mantiene su caja de 64x64 y el texto arranca a 76 px, dejando
    un aire igual a la mitad del alto del símbolo.

    El wordmark va como <text>: en un SVG suelto se resuelve con la pila de
    fuentes del sistema. Dentro de la app se usa el componente <Logo>, que
    dibuja el símbolo en SVG y el texto en HTML, para que tome la Inter
    Variable que ya carga la aplicación.
  -->
  <defs>
    <linearGradient id="h-ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#4F3FD6"/>
    </linearGradient>
  </defs>
  <path d="M43.47 15.62 A20 20 0 1 0 50.13 40.45"
        fill="none" stroke="url(#h-ring)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="51.32" cy="26.82" r="6.5" fill="#22D3EE"/>
  <text x="76" y="42"
        font-family="Inter Variable, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-1.1" fill="#0B0B10">Gesicomm</text>
</svg>
