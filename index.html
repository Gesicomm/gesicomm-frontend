<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Metadatos estáticos de la portada.

      Los componentes <Seo> de cada ruta los reemplazan en el navegador, pero
      esto es lo único que ven los bots que NO ejecutan JavaScript — entre
      ellos el crawler de Facebook y el de WhatsApp, que son los que arman el
      preview cuando alguien comparte gesicomm.com. Por eso acá va la ficha
      de la portada completa y no un título genérico.
    -->
    <title>Gesicomm · ERP y software SaaS para gestión de eCommerce</title>
    <meta
      name="description"
      content="ERP SaaS para gestión de eCommerce y Shopify. Administra productos, pedidos, inventario, clientes, logística y campañas de Facebook Ads en un único panel. Software de gestión de ventas para tiendas online."
    />
    <link rel="canonical" href="https://gesicomm.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Gesicomm" />
    <meta name="theme-color" content="#6D5EF8" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Gesicomm" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gesicomm · ERP y software SaaS para gestión de eCommerce" />
    <meta
      property="og:description"
      content="ERP para Shopify y tiendas online. Gestiona productos, pedidos, inventario, clientes, logística y campañas de Facebook Ads en un solo panel."
    />
    <meta property="og:url" content="https://gesicomm.com/" />
    <meta property="og:image" content="https://gesicomm.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gesicomm — toda la operación de tu eCommerce, en un solo lugar." />
    <meta property="og:locale" content="es_ES" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gesicomm · ERP y software SaaS para gestión de eCommerce" />
    <meta
      name="twitter:description"
      content="ERP para Shopify y tiendas online. Gestiona toda tu operación de eCommerce en un solo panel."
    />
    <meta name="twitter:image" content="https://gesicomm.com/og-image.png" />

    <!-- Iconos. El SVG es el que usan los navegadores modernos; los PNG son
         el respaldo y el icono de iOS. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Tres familias, tres trabajos distintos:

         · Archivo — titulares del sitio institucional. Es una grotesca de
           ancho variable derivada de las góticas que se usaban en formularios
           y grillas impresas; en su eje expandido da un titular que se lee
           como el encabezado de una planilla y no como la Inter de siempre.
         · IBM Plex Mono — etiquetas, cifras y todo lo tabular. El registro
           operativo de la portada necesita cifras de ancho fijo que aliñen en
           columna; una proporcional ahí se ve mal y encima miente sobre la
           naturaleza del dato.
         · Outfit — NO la usa el sitio institucional. Es para las landings
           que arman los usuarios (src/lib/landingDiseno.js la ofrece como
           tipografía elegible). No borrar: sin esto las landings que la
           eligieron caen a la fuente del sistema.

         El cuerpo de texto sigue siendo la Inter Variable que importa
         main.jsx desde node_modules: es una neutra excelente para leer
         párrafos y ya está local, sin costo de red. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Gesicomm",
        "url": "https://gesicomm.com",
        "logo": "https://gesicomm.com/icons/icon-512.png",
        "description": "ERP y software SaaS para gestión de eCommerce y Shopify.",
        "email": "contacto@gesicomm.com",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "contacto@gesicomm.com"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
