<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Metadatos estáticos de la portada.

      Los componentes <Seo> de cada ruta los reemplazan en el navegador, pero
      esto es lo único que ven los bots que NO ejecutan JavaScript — entre
      ellos el crawler de Facebook y el de WhatsApp, que son los que arman el
      preview cuando alguien comparte gesicomm.com. Por eso acá va la ficha
      de la portada completa y no un título genérico.
    -->
    <title>Gesicom | Creá y gestioná tu e-commerce en un solo lugar</title>
    <meta
      name="description"
      content="Todo lo que necesitás para crear, organizar y gestionar tu negocio e-commerce de forma simple y profesional: tienda online, productos, pedidos, clientes, inventario, envíos y más."
    />
    <link rel="canonical" href="https://gesicomm.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Gesicom" />
    <meta name="theme-color" content="#0B1D3D" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Gesicom" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gesicom | Creá y gestioná tu e-commerce en un solo lugar" />
    <meta
      property="og:description"
      content="Creá tu tienda online y gestioná productos, pedidos, clientes, inventario, envíos y métricas desde un solo panel simple y profesional."
    />
    <meta property="og:url" content="https://gesicomm.com/" />
    <meta property="og:image" content="https://gesicomm.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gesicom — tu e-commerce, desde cero y en un solo lugar." />
    <meta property="og:locale" content="es_ES" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gesicom | Creá y gestioná tu e-commerce en un solo lugar" />
    <meta
      name="twitter:description"
      content="Creá tu tienda online y gestioná productos, pedidos, clientes, inventario, envíos y métricas desde un solo lugar."
    />
    <meta name="twitter:image" content="https://gesicomm.com/og-image.png" />

    <!-- Iconos. El SVG es el que usan los navegadores modernos; los PNG son
         el respaldo y el icono de iOS. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Dos familias vía Google Fonts, más la stack de sistema:

         · IBM Plex Mono — etiquetas, cifras y todo lo tabular. El registro
           operativo de la portada necesita cifras de ancho fijo que aliñen en
           columna; una proporcional ahí se ve mal y encima miente sobre la
           naturaleza del dato.
         · Outfit — NO la usa el sitio institucional. Es para las landings
           que arman los usuarios (src/lib/landingDiseno.js la ofrece como
           tipografía elegible). No borrar: sin esto las landings que la
           eligieron caen a la fuente del sistema.

         El cuerpo de texto y los titulares institucionales usan la stack
         de sistema (-apple-system, ...): en Mac/iOS resuelve a SF Pro, la
         tipografía de marca, sin necesidad de licenciarla ni cargarla por
         red. Ver --font-sans / --font-display en src/index.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Gesicom",
        "url": "https://gesicomm.com",
        "logo": "https://gesicomm.com/icons/icon-512.png",
        "description": "Sistema para crear, organizar y gestionar un negocio e-commerce desde un solo lugar.",
        "email": "contacto@gesicomm.com",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "contacto@gesicomm.com"
        }
      }
    </script>
    <!--
      El tema se aplica ANTES del primer pintado, no desde React.

      No es solo por el parpadeo: ThemeProvider ponía data-theme en un
      useEffect, o sea DESPUÉS del primer render. Ese cambio tardío de los
      custom properties dejaba congelados en el tema anterior a todos los
      elementos con `transition: all` (105 en el proyecto) — Chromium no
      re-resuelve un `background: var(--x)` que está en transición. Ese era
      el motivo de que el modo claro "se tomara" en unos lados y en otros
      no, de forma aparentemente aleatoria.

      Va inline y sin async a propósito: tiene que correr antes de que el
      navegador pinte. Misma clave que usa ThemeProvider.
    -->
    <script>
      (function () {
        try {
          var g = localStorage.getItem('gesicomm-tema-publico');
          if (g !== 'light' && g !== 'dark') {
            g = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', g);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
